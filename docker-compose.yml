services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clipmarket
    ports:
      - "5432:5432"
    volumes:
      - clipmarket_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clipmarket"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  clipmarket_pg:
